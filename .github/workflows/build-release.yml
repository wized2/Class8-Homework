name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_note:
        description: "Optional release notes"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ "${{ github.event.repository.fork }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 missing"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/release.jks"
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace
          find app/build/outputs -name '*.apk' -ls

      - name: Package
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=v${VN}" >> "$GITHUB_OUTPUT"
          echo "apk=Class8-Homework-${VN}.apk" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          SRC=$(find app/build/outputs/apk -name '*.apk' | head -1)
          cp "$SRC" "dist/Class8-Homework-${VN}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Class8-Homework
          path: dist/*.apk

      - name: Release notes
        id: notes
        env:
          INPUT_NOTE: ${{ github.event.inputs.release_note }}
        run: |
          OUT="$GITHUB_WORKSPACE/release-body.md"
          if [ -n "$INPUT_NOTE" ]; then
            printf '%s\n' "$INPUT_NOTE" > "$OUT"
          elif [ -f release_note.md ]; then
            cat release_note.md > "$OUT"
          else
            echo "Class 8 Homework student app — signed release." > "$OUT"
          fi
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        if: github.event.repository.fork != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Class 8 Homework ${{ steps.ver.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/${{ steps.ver.outputs.apk }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
